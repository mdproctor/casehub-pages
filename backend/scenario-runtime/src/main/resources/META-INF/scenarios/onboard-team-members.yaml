playbook: "1.0"
schema: client
---
scenario: onboard-team-members
meta:
  description: "Onboard team members from CSV data with conditional admin access"
  labels:
    - domain:hr
    - capability:onboarding
  tags:
    - data-driven
    - getting-started
params:
  - name: teamName
    type: string
    required: true
  - name: grantAdmin
    type: boolean
    default: true
data:
  members:
    inline: |
      name:string,email:string,role:string,admin:boolean
      Alice Chen,alice@example.com,Developer,true
      Bob Martin,bob@example.com,Viewer,false
      Carol White,carol@example.com,Lead,true
steps:
  - navigate: "#teams/${params.teamName}"
    label: "Navigate to team page"
  - fill:
      role: textbox
      name: "Full Name"
      value: "${each.member.name}"
    label: "Fill name"
    forEach:
      as: member
      in: members
  - fill:
      role: textbox
      name: "Email"
      value: "${each.member.email}"
    label: "Fill email"
    forEach:
      as: member
      in: members
  - select:
      role: combobox
      name: "Role"
      value: "${each.member.role}"
    label: "Select role"
    forEach:
      as: member
      in: members
  - click:
      role: button
      name: "Create"
    label: "Create member"
    forEach:
      as: member
      in: members
  - click:
      role: button
      name: "Grant Admin"
    label: "Grant admin access"
    forEach:
      as: member
      in: members
    when: "${each.member.admin}"
