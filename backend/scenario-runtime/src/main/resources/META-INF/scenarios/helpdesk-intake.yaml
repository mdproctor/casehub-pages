scenario: helpdesk-intake
meta:
  description: "Demonstrate ticket intake workflow with form filling and submission"
  labels:
    - domain:helpdesk
    - capability:intake
  tags:
    - demo
    - getting-started
steps:
  - navigate: "#intake"
    label: "Navigate to intake form"
  - fill:
      role: textbox
      name: "Subject"
      value: "Network connectivity issue"
    label: "Fill ticket subject"
  - select:
      role: combobox
      name: "Priority"
      value: "high"
    label: "Select priority"
  - click:
      role: button
      name: "Submit"
    label: "Submit ticket"
