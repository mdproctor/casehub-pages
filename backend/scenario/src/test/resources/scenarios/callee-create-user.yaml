scenario: callee-create-user
params:
  - name: userName
    type: string
    required: true
  - name: userRole
    type: string
    default: "Viewer"
steps:
  - fill:
      role: textbox
      name: "Full Name"
      value: "${params.userName}"
    label: "Fill name"
  - select:
      role: combobox
      name: "Role"
      value: "${params.userRole}"
    label: "Select role"
  - click:
      role: button
      name: "Create"
    label: "Submit"
