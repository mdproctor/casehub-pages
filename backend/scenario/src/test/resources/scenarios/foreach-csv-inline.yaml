playbook: "1.0"
schema: client
---
scenario: foreach-csv-inline
data:
  members:
    inline: |
      name:string,role:string,admin:boolean
      Alice,Developer,true
      Bob,Viewer,false
steps:
  - fill:
      role: textbox
      name: "Full Name"
      value: "${each.member.name}"
    label: "Create member"
    forEach:
      as: member
      in: members
  - click:
      role: button
      name: "Grant Admin"
    label: "Grant admin"
    forEach:
      as: member
      in: members
    when: "${each.member.admin}"
