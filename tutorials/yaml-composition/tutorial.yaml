scenario: yaml-composition
meta:
  title: "CaseHub Playbook YAML Composition"
  description: "Watch variables, modules, forEach, and conditionals build progressively complex pages"
  area: yaml-composition
  labels:
    - concept:variables
    - concept:modules
    - concept:forEach
    - concept:conditionals
    - difficulty:beginner
  tags:
    - yaml
    - composition
    - getting-started
  estimated: "45 min"
  prerequisites: []
  hero:
    title: "CaseHub Playbook YAML Composition"
    subtitle: "Build complex pages from reusable, parameterized modules"
    icon: "🧩"

sections:
  - title: "YAML Basics"
    content:
      type: template
      path: content/01-yaml-basics.md
    steps:
      - editor-set-content:
          role: textbox
          name: "Page YAML source"
          value: |
            pages:
              - name: My First Page
                components:
                  - type: title
                    properties:
                      text: Hello World
          typing: progressive
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 3, col: 4}
          to: {line: 6, col: 27}
          style: pulse

  - title: "Multi-Component Pages"
    content:
      type: template
      path: content/02-structure.md
    steps:
      - editor-set-content:
          role: textbox
          name: "Page YAML source"
          value: |
            pages:
              - name: Sales Overview
                components:
                  - type: title
                    properties:
                      text: Sales Overview
                  - type: bar-chart
                    properties:
                      title: Revenue by Region
                  - type: data-table
                    properties:
                      title: Transaction Log
          typing: progressive
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 7, col: 6}
          to: {line: 12, col: 30}
          style: pulse

  - title: "Datasets"
    content:
      type: template
      path: content/03-datasets.md
    steps:
      - editor-set-content:
          role: textbox
          name: "Page YAML source"
          value: |
            datasets:
              sales:
                type: rest
                url: /api/sales
            pages:
              - name: Sales Overview
                components:
                  - type: title
                    properties:
                      text: Sales Overview
                  - type: bar-chart
                    properties:
                      title: Revenue by Region
                      dataset: sales
                  - type: data-table
                    properties:
                      title: Transaction Log
                      dataset: sales
          typing: progressive
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 1, col: 0}
          to: {line: 4, col: 18}
          style: glow

  - title: "Variables"
    content:
      type: template
      path: content/04-variables.md
    steps:
      - editor-set-content:
          role: textbox
          name: "Page YAML source"
          value: |
            variables:
              app:
                name: Sales Dashboard
                dataset: sales-data
            pages:
              - name: ${app.name}
                components:
                  - type: title
                    properties:
                      text: ${app.name}
                  - type: bar-chart
                    properties:
                      title: ${app.name} by Region
                  - type: data-table
                    properties:
                      title: ${app.name} Details
          typing: progressive
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 1, col: 0}
          to: {line: 4, col: 22}
          style: glow

  - title: "Variable Defaults"
    content:
      type: template
      path: content/05-variable-defaults.md
    steps:
      - editor-set-content:
          role: textbox
          name: "Page YAML source"
          value: |
            variables:
              app:
                name: Sales Dashboard
            pages:
              - name: ${app.name}
                components:
                  - type: title
                    properties:
                      text: ${app.name}
                  - type: bar-chart
                    properties:
                      title: ${app.subtitle:-Revenue Trends}
          typing: progressive
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 12, col: 14}
          to: {line: 12, col: 48}
          style: pulse

  - title: "ForEach Basics"
    content:
      type: template
      path: content/06-foreach-basics.md
    steps:
      - editor-set-content:
          role: textbox
          name: "Page YAML source"
          value: |
            pages:
              - name: Metrics Dashboard
                components:
                  cpu-metric:
                    type: metric
                    properties:
                      field: cpu
                  memory-metric:
                    type: metric
                    properties:
                      field: memory
                  disk-metric:
                    type: metric
                    properties:
                      field: disk
          typing: progressive
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 4, col: 6}
          to: {line: 16, col: 18}
          style: pulse
      - spotlight:
          target: {role: textbox, name: "Page YAML source"}
          content: "Three identical components — only the field value differs"
      - editor-set-content:
          role: textbox
          name: "Page YAML source"
          value: |
            pages:
              - name: Metrics Dashboard
                components:
                  metric:
                    type: metric
                    forEach:
                      as: field
                      in: [cpu, memory, disk]
                    properties:
                      field: ${each.field}
          typing: progressive
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 6, col: 8}
          to: {line: 8, col: 30}
          style: glow
      - spotlight:
          target: {role: tree, name: "Document outline"}
          content: "forEach generated three components from one template"

  - title: "ForEach with Data"
    content:
      type: template
      path: content/07-foreach-data.md
    steps:
      - editor-set-content:
          role: textbox
          name: "Page YAML source"
          value: |
            data:
              envs:
                inline: "name:STRING,port:INTEGER\nstaging,8080\nprod,443"
            iterations:
              envs:
                as: env
                in: []
            pages:
              - name: Deployment Status
                components:
                  deploy-step:
                    type: metric
                    forEach: envs
                    properties:
                      field: ${each.env.name}
                      port: ${each.env.port}
          typing: progressive
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 1, col: 0}
          to: {line: 7, col: 10}
          style: glow

  - title: "Modules"
    content:
      type: template
      path: content/08-modules-intro.md
    steps:
      - editor-set-content:
          role: textbox
          name: "Page YAML source"
          value: |
            pages:
              sales-dashboard:
                name: Sales Dashboard
                components:
                  chart:
                    type: bar-chart
                    properties:
                      title: Sales by Region
                      dataset: sales
              ops-dashboard:
                name: Ops Dashboard
                components:
                  chart:
                    type: bar-chart
                    properties:
                      title: Ops by Region
                      dataset: ops
          typing: progressive
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 2, col: 4}
          to: {line: 17, col: 16}
          style: pulse
      - spotlight:
          target: {role: textbox, name: "Page YAML source"}
          content: "Two dashboards with the same structure — only title and dataset differ"
      - editor-set-content:
          role: textbox
          name: "Page YAML source"
          value: |
            modules:
              dashboard:
                parameters:
                  label:
                    type: STRING
                    required: true
                  dataset:
                    type: STRING
                    required: true
                sections:
                  pages:
                    dashboard:
                      name: ${params.label} Dashboard
                      components:
                        chart:
                          type: bar-chart
                          properties:
                            title: ${params.label} by Region
                            dataset: ${params.dataset}
            imports:
              - module: dashboard
                as: sales
                parameters:
                  label: Sales
                  dataset: sales
              - module: dashboard
                as: ops
                parameters:
                  label: Ops
                  dataset: ops
            pages: {}
          typing: progressive
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 1, col: 0}
          to: {line: 19, col: 34}
          style: glow
      - spotlight:
          target: {role: tree, name: "Document outline"}
          content: "Two imports produce two dashboards from one reusable template"

  - title: "Module Parameters"
    content:
      type: template
      path: content/09-module-parameters.md
    steps:
      - editor-set-content:
          role: textbox
          name: "Page YAML source"
          value: |
            modules:
              card:
                parameters:
                  title:
                    type: STRING
                    required: true
                  subtitle:
                    type: STRING
                    required: false
                    defaultValue: Overview
                sections:
                  pages:
                    card-page:
                      name: ${params.title}
                      components:
                        heading:
                          type: title
                          properties:
                            text: ${params.title}
                        subheading:
                          type: title
                          properties:
                            text: ${params.subtitle}
            imports:
              - module: card
                as: welcome
                parameters:
                  title: Welcome
            pages: {}
          typing: progressive
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 7, col: 6}
          to: {line: 10, col: 26}
          style: glow

  - title: "Multiple Imports"
    content:
      type: template
      path: content/10-module-imports.md
    steps:
      - editor-set-content:
          role: textbox
          name: "Page YAML source"
          value: |
            modules:
              dashboard-page:
                parameters:
                  label:
                    type: STRING
                    required: true
                  dataset:
                    type: STRING
                    required: true
                sections:
                  pages:
                    page:
                      name: ${params.label} Dashboard
                      components:
                        chart:
                          type: bar-chart
                          properties:
                            title: ${params.label} Trends
                            dataset: ${params.dataset}
                        table:
                          type: data-table
                          properties:
                            title: ${params.label} Details
                            dataset: ${params.dataset}
            imports:
              - module: dashboard-page
                as: sales
                parameters:
                  label: Sales
                  dataset: sales-data
              - module: dashboard-page
                as: ops
                parameters:
                  label: Ops
                  dataset: ops-data
            pages: {}
          typing: progressive
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 31, col: 2}
          to: {line: 35, col: 20}
          style: pulse

  - title: "Module Outputs"
    content:
      type: template
      path: content/11-module-outputs.md
    steps:
      - editor-set-content:
          role: textbox
          name: "Page YAML source"
          value: |
            modules:
              data-source:
                parameters:
                  name:
                    type: STRING
                    required: true
                outputs:
                  id:
                    type: STRING
                    value: ${var.name}-dataset
                sections:
                  datasets:
                    source:
                      type: rest
                      url: /api/${params.name}
              viewer:
                parameters:
                  title:
                    type: STRING
                    required: true
                  dataset:
                    type: STRING
                    required: true
                sections:
                  pages:
                    view:
                      name: ${params.title}
                      components:
                        table:
                          type: data-table
                          properties:
                            dataset: ${params.dataset}
            imports:
              - module: data-source
                as: sales-src
                parameters:
                  name: sales
              - module: viewer
                as: sales-view
                parameters:
                  title: Sales View
                  dataset: ${module.sales-src.id}
            datasets: {}
            pages: {}
          typing: progressive
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 7, col: 4}
          to: {line: 10, col: 34}
          style: glow
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 42, col: 6}
          to: {line: 42, col: 37}
          style: pulse

  - title: "Conditionals"
    content:
      type: template
      path: content/12-conditionals.md
    steps:
      - editor-set-content:
          role: textbox
          name: "Page YAML source"
          value: |
            variables:
              features:
                showMetrics: "true"
                showTable: "false"
            pages:
              - name: Dashboard
                components:
                  metrics:
                    type: metric
                    when: "${features.showMetrics}"
                    properties:
                      field: revenue
                  details:
                    type: data-table
                    when: "${features.showTable}"
                    properties:
                      dataset: sales
          typing: progressive
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 10, col: 8}
          to: {line: 10, col: 42}
          style: glow
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 15, col: 8}
          to: {line: 15, col: 40}
          style: glow

  - title: "Composition"
    content:
      type: template
      path: content/13-composition.md
    steps:
      - editor-set-content:
          role: textbox
          name: "Page YAML source"
          value: |
            variables:
              config:
                team: Engineering
            modules:
              header:
                parameters:
                  title:
                    type: STRING
                    required: true
                sections:
                  pages:
                    banner:
                      name: ${params.title}
                      components:
                        heading:
                          type: title
                          properties:
                            text: ${params.title}
              data-panel:
                parameters:
                  label:
                    type: STRING
                    required: true
                  dataset:
                    type: STRING
                    required: true
                sections:
                  pages:
                    panel:
                      name: ${params.label} Data
                      components:
                        chart:
                          type: bar-chart
                          properties:
                            title: ${params.label} Trends
                            dataset: ${params.dataset}
                        table:
                          type: data-table
                          properties:
                            title: ${params.label} Details
                            dataset: ${params.dataset}
            imports:
              - module: header
                as: top
                parameters:
                  title: ${config.team} Portal
              - module: data-panel
                as: stats
                parameters:
                  label: ${config.team}
                  dataset: team-metrics
            pages: {}
          typing: progressive
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 46, col: 6}
          to: {line: 46, col: 34}
          style: pulse
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 50, col: 6}
          to: {line: 50, col: 27}
          style: pulse

  - title: "Iteration Groups"
    content:
      type: template
      path: content/14-iteration-groups.md
    steps:
      - editor-set-content:
          role: textbox
          name: "Page YAML source"
          value: |
            iterations:
              regions:
                as: region
                in: [us, eu, ap]
            pages:
              - name: Regional Overview
                components:
                  chart:
                    type: bar-chart
                    forEach: regions
                    properties:
                      title: ${each.region} Sales
                  table:
                    type: data-table
                    forEach: regions
                    properties:
                      title: ${each.region} Details
          typing: progressive
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 10, col: 8}
          to: {line: 10, col: 24}
          style: glow
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 15, col: 8}
          to: {line: 15, col: 24}
          style: glow

  - title: "Full Application"
    content:
      type: template
      path: content/15-full-application.md
    steps:
      - editor-set-content:
          role: textbox
          name: "Page YAML source"
          value: |
            variables:
              app:
                title: Operations Center
            modules:
              header:
                parameters:
                  title:
                    type: STRING
                    required: true
                sections:
                  pages:
                    banner:
                      name: ${params.title}
                      components:
                        heading:
                          type: title
                          properties:
                            text: ${params.title}
              data-panel:
                parameters:
                  label:
                    type: STRING
                    required: true
                  dataset:
                    type: STRING
                    required: true
                sections:
                  pages:
                    panel:
                      name: ${params.label}
                      components:
                        chart:
                          type: bar-chart
                          properties:
                            title: ${params.label} Overview
                            dataset: ${params.dataset}
                        table:
                          type: data-table
                          properties:
                            title: ${params.label} Details
                            dataset: ${params.dataset}
            imports:
              - module: header
                as: header
                parameters:
                  title: ${app.title}
              - module: data-panel
                as: infra
                parameters:
                  label: Infrastructure
                  dataset: infra-metrics
            pages: {}
          typing: progressive
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 1, col: 0}
          to: {line: 3, col: 26}
          style: glow
      - editor-highlight:
          role: textbox
          name: "Page YAML source"
          from: {line: 42, col: 0}
          to: {line: 51, col: 24}
          style: glow
      - spotlight:
          target: {role: tree, name: "Document outline"}
          content: "Variables, modules, and imports compose into a complete application"
