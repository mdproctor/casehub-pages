pages:
- name: Scenario Controller
  properties:
    margin: 20px
  rows:
  - columns:
    - span: 7
      components:
      - type: html
        properties:
          content: |
            <div>
              <h2 style="margin: 0 0 16px; color: var(--pages-neutral-12);">Application Under Test</h2>
              <div style="display: flex; gap: 16px; margin-bottom: 16px;">
                <div style="flex: 1; background: var(--pages-neutral-2); border: 1px solid var(--pages-neutral-4); border-radius: 8px; padding: 16px;">
                  <div style="font-size: 11px; color: var(--pages-neutral-9); text-transform: uppercase; letter-spacing: 0.5px;">Status</div>
                  <div id="app-status" style="font-size: 20px; font-weight: 700; color: #4ade80; margin-top: 4px;">Ready</div>
                </div>
                <div style="flex: 1; background: var(--pages-neutral-2); border: 1px solid var(--pages-neutral-4); border-radius: 8px; padding: 16px;">
                  <div style="font-size: 11px; color: var(--pages-neutral-9); text-transform: uppercase; letter-spacing: 0.5px;">Current Step</div>
                  <div id="current-step" style="font-size: 20px; font-weight: 700; color: #3b82f6; margin-top: 4px;">—</div>
                </div>
              </div>
              <div style="background: var(--pages-neutral-2); border: 1px solid var(--pages-neutral-4); border-radius: 8px; padding: 16px;">
                <div style="margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--pages-neutral-12);">Event Log</div>
                <div id="event-log" style="max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; color: var(--pages-neutral-9); line-height: 1.8;"></div>
              </div>
              <div style="margin-top: 16px; display: flex; gap: 8px;" id="demo-buttons"></div>
            </div>
    - span: 5
      components:
      - type: html
        properties:
          content: |
            <div>
              <div id="controller-mount" style="min-height: 300px;"></div>
            </div>
