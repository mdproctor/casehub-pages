datasets:
  - uuid: allEvents
    url: ws://localhost:8090/ws/push?dataset=events

pages:
  - name: Multi-Topic Dashboard
    rows:
      - columns:
          - components:
              - type: html
                properties:
                  content: |
                    <div style="padding: 20px; background: var(--pages-surface-tertiary, #1a1a2e); border: 1px solid var(--pages-border-subtle, #333); border-radius: 8px; margin-bottom: 16px;">
                      <h2 style="margin: 0 0 8px; color: var(--pages-text-primary, #eee); font-size: 20px;">Multi-Topic Dashboard</h2>
                      <p style="margin: 0 0 12px; color: var(--pages-text-muted, #999); font-size: 14px;">
                        Wildcard subscription <code style="background: var(--pages-surface-secondary, #2a2a3e); padding: 2px 6px; border-radius: 3px;">demo:**</code>
                        receives events from all demo topics — <code style="background: var(--pages-surface-secondary, #2a2a3e); padding: 2px 6px; border-radius: 3px;">demo:events</code>,
                        <code style="background: var(--pages-surface-secondary, #2a2a3e); padding: 2px 6px; border-radius: 3px;">demo:metrics</code>,
                        <code style="background: var(--pages-surface-secondary, #2a2a3e); padding: 2px 6px; border-radius: 3px;">demo:alerts</code>,
                        and <code style="background: var(--pages-surface-secondary, #2a2a3e); padding: 2px 6px; border-radius: 3px;">demo:persistence</code> — in a single data table.
                      </p>
                      <p style="margin: 0; color: var(--pages-text-muted, #888); font-size: 13px;">
                        ▸ Start the backend: <code style="background: var(--pages-surface-secondary, #2a2a3e); padding: 2px 6px; border-radius: 3px;">./start-server.sh</code> in <code style="background: var(--pages-surface-secondary, #2a2a3e); padding: 2px 6px; border-radius: 3px;">examples/</code>
                      </p>
                    </div>
      - columns:
          - components:
              - type: data-table
                properties:
                  lookup:
                    uuid: allEvents
