pages:
  - name: Workspace Compositor
    components:
      - type: dock-workbench
        centre:
          - type: floating-workspace
            centre:
              - type: markdown
                properties:
                  content: >
                    ## Workspace Compositor

                    Frame tabs with nested workspaces. Each tab contains
                    its own floating frames with independent layout.

                    **Try it:**

                    - Click **☰** on a frame to toggle accordion view
                    - Each nested workspace has its own floating frames
                    - Frames can be dragged, resized, pinned independently
            frames:
              - key: workbench
                viewMode: accordion
                tabs:
                  - key: editor
                    label: Editor
                    content:
                      type: floating-workspace
                      centre:
                        - type: markdown
                          properties:
                            content: >
                              Editor workspace — floating frames here are
                              independent of the Debug workspace.
                      frames:
                        - key: outline
                          tabs:
                            - key: outline-tab
                              label: Outline
                              content:
                                type: html
                                properties:
                                  content: >
                                    <div style="padding:12px">
                                      <h3>Outline</h3>
                                      <p>Document structure panel.</p>
                                    </div>
                          position: { x: 20, y: 20 }
                          size: { width: 280, height: 200 }
                  - key: debug
                    label: Debug
                    content:
                      type: floating-workspace
                      centre:
                        - type: html
                          properties:
                            content: >
                              <div style="padding:12px">
                                <h3>Debug Console</h3>
                                <p>Each workspace tab has independent frames.</p>
                              </div>
                position: { x: 40, y: 30 }
                size: { width: 600, height: 400 }
        left:
          zones: 1
          panels:
            - key: explorer
              label: Explorer
              icon: "\U0001F4C1"
              defaultOpen: true
              content:
                type: html
                properties:
                  content: >
                    <div style="padding:12px">
                      <h3>Explorer</h3>
                      <p>Tool windows work alongside nested workspaces.</p>
                    </div>
        statusBar:
          type: html
          properties:
            content: "<div style='padding: 2px 8px; font-size: 12px; color: var(--pages-neutral-8, #888);'>Workspace Compositor Demo</div>"
