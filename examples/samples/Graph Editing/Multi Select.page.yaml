pages:
  - name: Multi Select
    components:
      - type: html
        properties:
          content: |
            <div style="display: flex; flex-direction: column; flex: 1; min-height: 0; height: 100%; gap: 8px;">
              <div style="font-family: var(--pages-font-family, system-ui); font-size: 13px; color: var(--pages-neutral-11, #d4d4d4); line-height: 1.5; padding: 0 4px;">
                <strong>Multi-Select Demo</strong> &mdash; Shift+drag for rubber-band select. Plain drag pans.<br/>
                <strong>Valid 2+:</strong> {Clean, Lookup} or {Lookup, Format} in Chain 2 &mdash; Shift+drag around them, blue outlines.<br/>
                <strong>Invalid:</strong> {Parse, Enrich} without Normalise &mdash; Enrich branches, 2 outbound = red outlines.<br/>
                <strong>Delete:</strong> Select {Clean, Lookup}, press Delete &mdash; auto-joins Source2&rarr;Format. &bull; <strong>Splice:</strong> hold-drag (~300ms) onto a Chain 1 edge.
              </div>
              <div style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
                <graph-canvas-core id="ms-canvas" style="flex: 1; display: block; border: 1px solid var(--pages-neutral-4, #d1d5db); border-radius: 8px; overflow: hidden; min-height: 200px;"></graph-canvas-core>
              </div>
              <div style="font-family: var(--pages-font-family, system-ui);">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                  <strong style="font-size: 13px; color: var(--pages-neutral-11, #374151);">Mutation Log</strong>
                  <button id="ms-clear-log" style="font-size: 11px; padding: 2px 8px; border: 1px solid var(--pages-neutral-5); border-radius: 4px; background: var(--pages-neutral-3); color: var(--pages-neutral-11); cursor: pointer;">Clear</button>
                </div>
                <pre id="ms-mutation-log" style="font-size: 11px; max-height: 100px; overflow-y: auto; padding: 8px; background: var(--pages-neutral-2, #1e1e1e); border-radius: 4px; color: var(--pages-neutral-11, #d4d4d4); margin: 0;"></pre>
              </div>
            </div>
