  - sem-worker: { name: "pool", permits: 2, worker: "B", duration: 300 }
  - sem-worker: { name: "pool", permits: 2, worker: "C", duration: 500 }
  - sem-worker: { name: "pool", permits: 2, worker: "D", duration: 200 }
