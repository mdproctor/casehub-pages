playbook: "1.0"
schema: client
---
scenario: signal-await-demo
meta:
  title: "Signal / Await"
  description: "One-way dependency between branches. Sender signals after a click, receiver blocks until the signal arrives."
  tags:
    - signal
    - await
    - concurrent
    - coordination
steps:
  - concurrent:
      sender:
        - click: { role: button, name: "A" }
        - signal: go
      receiver:
        - await: { signal: go }
        - click: { role: button, name: "B" }
